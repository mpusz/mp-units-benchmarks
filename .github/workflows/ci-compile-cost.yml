# Compile cost of the corpus: one gate, plus a measurement fleet whose results are aggregated into
# a single table at the end of the run.
#
#   gate     - clang, -std=c++23 (what the recorded baselines were measured with), instantiation
#              counts against those baselines with TIGHT bands. Growth fails the build so borderline
#              growth is investigated here rather than in mp-units, whose own workflow blocks only on
#              egregious growth; an improvement opens a PR re-recording the baselines.
#   measure  - one runner per compiler, each producing every metric it can (counts only from clang;
#              wall time and peak memory from any compiler), uploaded as an artifact.
#   summary  - merges those artifacts into one markdown report in the job summary.
#
# Counts and peak memory are comparable across every column of that report; wall time is NOT, since
# each arm runs on its own runner. The report says so itself.
name: Compile cost

# A dispatched run should say what it measured, straight from the runs list. Every other trigger
# yields an empty string here, which GitHub documents as "use the event-specific default" - so a
# push keeps showing the commit message that caused it.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Compile cost: {0}{1}', inputs.ref, inputs.compare_ref != '' && format(' vs {0}', inputs.compare_ref) || '')
      || '' }}

on:
  push:
  pull_request:
  # Only polling for movement of MP_UNITS_REF: nothing accumulates between runs, and the gate job
  # exits before compiling when master has not moved since the baselines were recorded. Timed for
  # the middle of the night in Europe/Warsaw so a fleet of runners never competes with working hours.
  schedule:
    - cron: '30 0 * * 1' # Mondays, 00:30 UTC = 01:30 CET / 02:30 CEST
  workflow_dispatch:
    inputs:
      ref:
        description: 'mp-units ref to measure - branch, tag or sha (a feature branch is the point)'
        default: master
      compare_ref:
        description: 'optional second mp-units ref - measured alongside the first in every arm'
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MP_UNITS_REF: ${{ inputs.ref || 'master' }}
  COMPARE_REF: ${{ inputs.compare_ref || '' }}
  # The default clang, and therefore the one the reviewed baselines are recorded with: the gate,
  # the re-record PR and the modules-ab pair all derive their compiler from this one value.
  # Changing it requires baselines for the new compiler to exist first - `check` refuses to
  # compare numbers recorded under a different configuration - and mp-units' own
  # ci-compile-time.yml pins the same version in CLANG_VERSION, which must move with it.
  GATE_CLANG: 23
  # Tighter than the bands mp-units blocks on: borderline growth must go red here first.
  # Asymmetric on purpose. Totals grow when the library gains a feature - which must not fail a build - so
  # SLACK is loose. SLOPE_SLACK is the tight one, because nothing legitimate moves the marginal cost of one
  # more line of user code. See "Gate semantics" in CLAUDE.md.
  SLACK: 2 # per-workflow total growth that blocks
  SLOPE_SLACK: 1 # marginal cost per step - the band that actually means "slower"
  MEDIAN_ALARM: 0.5
  TIGHTEN_NOTICE: 2
  BRANCH_PREFIX: auto/tighten-baselines

jobs:
  gate:
    # One gate per language standard the library supports: counts differ per -std, and a regression
    # can appear in one standard alone (a c++26-only code path, a c++20 fallback).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { std: c++20, id: cxx20 }
          - { std: c++23, id: cxx23 }
          - { std: c++26, id: cxx26 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check out mp-units at ${{ env.MP_UNITS_REF }}
        uses: actions/checkout@v5
        with:
          repository: mpusz/mp-units
          ref: ${{ env.MP_UNITS_REF }}
          path: mp-units
      - name: Smoke-test the runner
        # Catches import-time breakage (the runner's Python is not necessarily the author's) before
        # this job spends minutes installing a toolchain.
        run: |
          runner/bench.py --help > /dev/null
          runner/bench.py --cxx clang++-${{ env.GATE_CLANG }} key
      - name: Install Clang ${{ env.GATE_CLANG }}
        shell: bash
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.GATE_CLANG }}
          sudo apt install -y libc++-${{ env.GATE_CLANG }}-dev libc++abi-${{ env.GATE_CLANG }}-dev libunwind-${{ env.GATE_CLANG }}-dev
      - name: Record what was measured
        shell: bash
        run: |
          {
            echo "| gated against | value |"
            echo "|---|---|"
            echo "| mp-units ref | \`${MP_UNITS_REF}\` @ $(git -C mp-units describe --tags --always --dirty) |"
            echo "| library version | $(sed -nE 's/.*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' mp-units/src/CMakeLists.txt | head -1) |"
            echo "| compiler | $(clang++-${GATE_CLANG} --version | head -1), \`-std=${{ matrix.std }}\` |"
            echo "| bands | slack ${SLACK}%, slope ${SLOPE_SLACK}%, median ${MEDIAN_ALARM}%, tighten ${TIGHTEN_NOTICE}% |"
            echo
            # One paragraph per echo: GitHub turns a newline inside a paragraph into a line break.
            echo "- **slack ${SLACK}%** - one workflow's total growing more than this fails the build. Loose by design: a total grows when the library gains a feature, and that must not be blocked."
            echo "- **slope ${SLOPE_SLACK}%** - the marginal cost of one more step in the \`scaling/\` series. This is the band that means *slower* rather than *larger*: a feature lifts every total a little and leaves the slope alone. Tighter than slack for that reason."
            echo "- **median ${MEDIAN_ALARM}%** - the median growth across non-umbrella workflows (umbrella/ is excluded: it grows legitimately when the systems do). A median this size means the whole framework got more expensive, not one workflow, and should almost never be re-recorded away."
            echo "- **tighten ${TIGHTEN_NOTICE}%** - an improvement this large opens a PR re-recording the baselines, because a stale baseline hides a later regression of the same size."
            echo
            echo "mp-units gates the same numbers loosely (slack 3%, median 2%, advisory 1%), so growth it merely annotates goes red here - which is the point of the split."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Skip trees the baselines already describe
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Checked explicitly: `set -e` does not abort on a failing command substitution in an
          # assignment, and an empty path would be read as '.' further down.
          if ! BASELINE_FILE="$(runner/bench.py --cxx clang++-${GATE_CLANG} --std ${{ matrix.std }} key)" || [ -z "$BASELINE_FILE" ]; then
            echo "::error::could not resolve the baseline file for clang++-${GATE_CLANG} ${{ matrix.std }}"
            exit 1
          fi
          export BASELINE_FILE
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          key = os.environ["GATE_CLANG"]
          data = json.loads(pathlib.Path(os.environ["BASELINE_FILE"]).read_text())
          head = subprocess.run(["git", "-C", "mp-units", "rev-parse", "HEAD"],
                                capture_output=True, text=True).stdout.strip()
          recorded = data.get("mp_units_sha")
          # Same tree AND same compiler means the comparison cannot have moved since the baselines
          # were recorded. Only worth skipping on a schedule: when a human pushed or dispatched, the
          # table is the point of the run, and two minutes is a cheap price for it.
          unchanged = bool(recorded) and recorded == head and data.get("cxx") == f"clang++-{key}"
          skip = unchanged and os.environ.get("EVENT_NAME") == "schedule"
          print(f"baselines describe {recorded or '(no sha recorded)'}, checked out {head}"
                f" -> {'nothing to measure' if skip else 'measuring'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"measure={'false' if skip else 'true'}\n")
          if skip:  # never leave a job with an empty summary: say why there is no table
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"### instantiation counts - not re-measured\n\nThe baselines already "
                                f"describe this exact tree (`{head[:9]}`) for this compiler, so a scheduled "
                                f"run would only prove +0.00%. A push, a pull request or a dispatch always "
                                f"measures.\n\n")
          PY
      - name: Compare against the reviewed baselines
        id: check
        if: steps.guard.outputs.measure == 'true'
        continue-on-error: true # the reactions below run first; the job fails at the end
        run: |
          runner/bench.py --repo mp-units --cxx clang++-${{ env.GATE_CLANG }} --std ${{ matrix.std }} check \
            --report results/report.json \
            --slack ${{ env.SLACK }} --slope-slack ${{ env.SLOPE_SLACK }} \
            --median-alarm ${{ env.MEDIAN_ALARM }} --tighten-notice ${{ env.TIGHTEN_NOTICE }}
      - uses: actions/upload-artifact@v7
        # The gate page points here for its per-workflow evidence: the summary carries the verdict,
        # the movers and the attribution, and this JSON carries every metric's value vs baseline.
        if: steps.guard.outputs.measure == 'true'
        with:
          name: gate-report-${{ matrix.id }}
          path: results/report.json
          retention-days: 30
      - name: Decide whether the baselines can be tightened
        id: decide
        if: steps.guard.outputs.measure == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          report = pathlib.Path("results/report.json")
          min_median = float(os.environ["MEDIAN_ALARM"]) / 100

          def decide(value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"tighten={value}\n")

          if not report.exists():
              print("no report written - the comparison never got as far as comparing counts")
              decide("false")
              sys.exit(0)

          r = json.loads(report.read_text())
          if r["regressions"]:
              print("regressions present, leaving this to a human:", ", ".join(r["regressions"]))
              decide("false")
              sys.exit(0)

          median = r["median_non_umbrella"]
          if not r["improvements"] and median > -min_median:
              print(f"nothing worth a PR (median {median:+.1%}, no workflow past the tighten band)")
              decide("false")
              sys.exit(0)

          workflows = r["workflows"]
          best = min((d["rel"] for d in workflows.values() if not d["umbrella"]), default=0.0)
          lines = [
              f"mp-units {r['mp_units_version']} (`{r.get('mp_units_describe', 'unknown tree')}`) needs",
              "measurably fewer template instantiations than",
              f"`baselines/instantiations-{r['baseline_key']}.json` records, so the baselines are stale.",
              "Leaving them stale desensitizes the gate: a later regression of the same size would pass",
              "unnoticed.",
              "",
              f"- best single workflow: **{best:+.1%}**",
              f"- median across non-umbrella workflows: **{median:+.1%}**",
              f"- measured with `{r['cxx']}`, tighten band {r['bands']['tighten_notice']:g}%",
              "",
              "| workflow | baseline | current | delta |",
              "|---|---:|---:|---:|",
          ]
          for name, d in sorted(workflows.items(), key=lambda kv: kv[1]["rel"]):
              label = f"{name} (churn-expected)" if d["umbrella"] else name
              lines.append(f"| {label} | {d['baseline']} | {d['current']} | {d['rel']:+.1%} |")
          lines += ["", "Generated by the `Compile cost` workflow. Review the numbers before merging:",
                    "a re-record blesses the current counts of *every* workflow, not only the improved ones."]
          pathlib.Path("pr-body.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          decide("true")
          PY
      - name: Re-record and hand the baselines to the consolidator
        # The PR itself is opened by the `tighten` job below, ONCE for every standard that improved -
        # a re-record is one logical event, and three per-standard PRs were three reviews of it.
        if: steps.decide.outputs.tighten == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          runner/bench.py --repo mp-units --cxx "clang++-${GATE_CLANG}" --std ${{ matrix.std }} update
          mkdir -p tighten
          cp "$(runner/bench.py --cxx clang++-${GATE_CLANG} --std ${{ matrix.std }} key)" tighten/
          mv pr-body.md "tighten/pr-body-${{ matrix.id }}.md"
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.tighten == 'true' && github.event_name != 'pull_request'
        with:
          name: tighten-${{ matrix.id }}
          path: tighten/
          retention-days: 3
      - name: Fail on regression
        if: steps.check.outcome == 'failure'
        run: |
          echo "a gated metric moved past its band - see the tables and the single annotation above"
          exit 1

  tighten:
    # One PR for the whole re-record, however many standards improved. Runs only when every gate arm is
    # green: a regression anywhere means a human is already looking at this tree, and an auto-PR that
    # blesses the other standards' numbers underneath them is exactly the kind of helpful that is not.
    needs: gate
    if: needs.gate.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: tighten-*
          path: tighten
          merge-multiple: true
      - name: Open or refresh the single tightening pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(tighten/instantiations-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no gate arm asked for a re-record - nothing to do"
            echo "No baselines to tighten this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_PREFIX"
          cp tighten/instantiations-*.json baselines/
          {
            echo "One re-record, one review: every standard whose gate arm found the baselines stale is"
            echo "updated together, because they describe the same library tree."
            echo
            for body in tighten/pr-body-*.md; do
              std=$(basename "$body" .md); std=${std#pr-body-}
              echo "<details><summary>${std}</summary>"
              echo
              cat "$body"
              echo
              echo "</details>"
              echo
            done
          } > pr-body.md
          git add baselines
          git commit -m "chore: tighten instantiation baselines

          Re-recorded against mp-units ${MP_UNITS_REF} for: $(basename -a "${files[@]}" | sed 's/instantiations-//;s/\.json//' | paste -sd', ')."
          git push -f origin "$BRANCH_PREFIX"
          if gh pr view "$BRANCH_PREFIX" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH_PREFIX" --body-file pr-body.md
            echo "refreshed the open PR"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH_PREFIX" \
              --title "chore: tighten instantiation baselines" --body-file pr-body.md
          fi

  measure:
    # One runner per compiler: arms cannot interfere, and a compiler that cannot build the corpus only
    # costs its own arm. The set is exactly mp-units' supported compilers that can do -std=c++26, so
    # every column is the same standard and therefore comparable. Deliberately absent: clang 16 (only
    # spells it -std=c++2c), gcc 12 and 13 (no c++26; gcc 13 also has no <print>), clang 19 (mp-units
    # does not support it) and clang 22, which still fails to compile the library for a reason
    # unrelated to the NTTP `decltype` bug mp-units fixed for 23 - so 21 and 23 are adjacent here
    # while LLVM 22 is skipped, exactly as in mp-units' own matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: clang17, cxx: clang++-17, std: c++26, install: clang }
          - { id: clang18, cxx: clang++-18, std: c++26, install: clang }
          - { id: clang20, cxx: clang++-20, std: c++26, install: clang }
          - { id: clang21, cxx: clang++-21, std: c++26, install: clang }
          - { id: clang23, cxx: clang++-23, std: c++26, install: clang }
          - { id: gcc14, cxx: g++-14, std: c++26, install: gcc }
          - { id: gcc15, cxx: g++-15, std: c++26, install: gcc-ppa }
          - { id: gcc16, cxx: g++-16, std: c++26, install: gcc-ppa, experimental: true }
          # How the library is consumed is a configuration axis of its own. `import std;` needs the
          # standard library's own module built first; modules need that plus the mp-units BMIs, and
          # the runner reports what building them cost as `bmi/*` rows.
          - { id: clang23-importstd, cxx: clang++-23, std: c++26, install: clang, args: --import-std }
          # Four clang versions in the modules configuration: comparing how the interface build
          # itself evolves is half the point, and clang 17 is out because libc++ 17 ships no std.cppm.
          - { id: clang18-modules, cxx: clang++-18, std: c++26, install: clang, args: --modules --import-std }
          - { id: clang20-modules, cxx: clang++-20, std: c++26, install: clang, args: --modules --import-std }
          - { id: clang21-modules, cxx: clang++-21, std: c++26, install: clang, args: --modules --import-std }
          - { id: clang23-modules, cxx: clang++-23, std: c++26, install: clang, args: --modules --import-std }
          # GCC cannot build the mp-units modules yet (mp-units#717: `recursive lazy load` in the
          # systems BMI), so it gets the `import std;` arm only.
          - { id: gcc16-importstd, cxx: g++-16, std: c++26, install: gcc-ppa, args: --import-std, experimental: true }
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out mp-units at ${{ env.MP_UNITS_REF }}
        uses: actions/checkout@v5
        with:
          repository: mpusz/mp-units
          ref: ${{ env.MP_UNITS_REF }}
          path: mp-units
          # Full history only when a second ref is requested, since each ref becomes a worktree.
          fetch-depth: ${{ inputs.compare_ref != '' && '0' || '1' }}
      - name: Smoke-test the runner
        run: runner/bench.py --help > /dev/null
      - name: Install ${{ matrix.cxx }}
        shell: bash
        run: |
          case "${{ matrix.install }}" in
            clang)
              version="$(echo '${{ matrix.cxx }}' | tr -dc '0-9')"
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh "$version"
              sudo apt install -y libc++-"$version"-dev libc++abi-"$version"-dev libunwind-"$version"-dev
              ;;
            gcc-ppa)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt update
              sudo apt install -y "${{ matrix.cxx }}"
              ;;
            *)
              sudo apt install -y "${{ matrix.cxx }}"
              ;;
          esac
          ${{ matrix.cxx }} --version | head -1
      - name: Measure every metric ${{ matrix.cxx }} can produce
        shell: bash
        run: |
          runner/bench.py --repo mp-units --cxx "${{ matrix.cxx }}" --std "${{ matrix.std }}" \
            ${{ matrix.args }} report ${MP_UNITS_REF} ${COMPARE_REF} --reps 2 \
            --output "results/report-${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: measurements-${{ matrix.id }}
          path: results/report-${{ matrix.id }}.json

  modules-ab:
    # Wall clocks may only be compared within ONE machine: the fleet's arms each get their own
    # runner, and those report a single generic hostname over wildly different CPUs (one run
    # spanned Xeon 8573C, EPYC 7763 and EPYC 9V74), so a cross-arm time delta is noise. This job
    # measures headers and `import mp_units;` back to back on one VM and tags both payloads with a
    # shared --machine-tag - the only thing that licenses the summary's same-machine sections (the
    # safety ladder, the modules consumer wall clock).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check out mp-units at ${{ env.MP_UNITS_REF }}
        uses: actions/checkout@v5
        with:
          repository: mpusz/mp-units
          ref: ${{ env.MP_UNITS_REF }}
          path: mp-units
          fetch-depth: 1
      - name: Install clang
        shell: bash
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${{ env.GATE_CLANG }}"
          sudo apt install -y libc++-${{ env.GATE_CLANG }}-dev libc++abi-${{ env.GATE_CLANG }}-dev \
            libunwind-${{ env.GATE_CLANG }}-dev
      - name: Measure headers and modules on one machine
        shell: bash
        run: |
          TAG="ab-${{ github.run_id }}"
          COMMON=(--repo mp-units --cxx "clang++-${GATE_CLANG}" --std c++26 --config-label ab)
          # A DELIBERATELY BALANCED DOZEN, not the whole corpus: this job's numbers feed the safety
          # ladder and the same-machine modules rows, and nothing else reads them (the price list and
          # the interface breakdown come from the full-corpus arms). Measuring 45 workflows twice at
          # best-of-2 - three compiles each - cost 36 minutes, most of it re-proving what the fleet
          # already measures. What must stay is the ladder's four rungs and a balance between
          # include-dominated and use-dominated workflows, because the finding this pair exists to
          # make is that modules win on the former and lose on the latter: a set weighted either way
          # would decide that split by selection instead of by measurement.
          ARGS=(report "${MP_UNITS_REF}" --reps 2 --machine-tag "$TAG" --workflows
                safety/                     # the ladder: all four rungs
                control/core_only           # the framework intercept
                umbrella/si_umbrella umbrella/isq_umbrella umbrella/codata_umbrella
                                            # include-dominated, spanning small to very large
                scaling/broad_256 scaling/typed_broad_256 scaling/define_constants_256
                                            # use-dominated: unit composition, typed composition,
                                            # constant definitions
                text/output_format)         # a formatting-heavy TU, a code shape of its own
          # Plain headers against the FULL modules configuration - `--modules --import-std`, the same
          # one the fleet measures and the one a user adopting modules would actually write, so the
          # std module's own interface cost appears in the breakdown instead of being invisible.
          runner/bench.py "${COMMON[@]}" "${ARGS[@]}" --output results/report-ab-headers.json
          runner/bench.py "${COMMON[@]}" --modules --import-std "${ARGS[@]}" \
            --output results/report-ab-modules.json
      - uses: actions/upload-artifact@v7
        with:
          name: measurements-ab
          path: results/report-ab-*.json

  report:
    # Aggregates the fleet. `always()` so an experimental arm that died still leaves a table for the
    # arms that succeeded.
    needs: [measure, modules-ab]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: measurements-*
          path: results
          merge-multiple: true
      - name: Fetch the previous run's measurements
        # So the summary can SAY what the last changes bought instead of describing one point in time.
        # Best effort on purpose: the first run, an expired artifact, or an API hiccup just means the
        # comparison section is absent, never a red job.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Any COMPLETED run that produced the artifact will do: a failing gate makes the run red
          # while the measurements it uploaded are exactly as valid, and requiring success aged this
          # comparison out to five days and nine commits during a period of red gates.
          for prev_run in $(gh api "repos/${{ github.repository }}/actions/workflows/ci-compile-cost.yml/runs?status=completed&per_page=15" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | .[]" 2>/dev/null); do
            if gh run download "$prev_run" --name compile-cost-report --dir previous 2>/dev/null; then
              echo "comparing against run $prev_run"
              ls previous/report-*.json 2>/dev/null | head -20
              exit 0
            fi
          done
          echo "no previous run carries a compile-cost-report artifact"
      - name: Post the combined table
        id: post
        shell: bash
        run: |
          shopt -s nullglob
          reports=(results/report-*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no measurement artifacts to summarise" >> "$GITHUB_STEP_SUMMARY"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=(previous/report-*.json)
          prev_args=()
          [ ${#previous[@]} -gt 0 ] && prev_args=(--previous "${previous[@]}")
          # The PAGE lands in the job summary and ships in the artifact; the full per-workflow
          # tables ship beside it as -full.md - a summary cannot be downloaded, diffed against last
          # week's, or pasted into a talk, and a 1400-line table cannot be read on a page.
          name="compile-cost-$(echo "${MP_UNITS_REF}" | tr '/' '-')"
          [ -n "$COMPARE_REF" ] && name="$name-vs-$(echo "${COMPARE_REF}" | tr '/' '-')"
          runner/bench.py summary "${reports[@]}" "${prev_args[@]}" \
            --full-output "results/$name-full.md" > "results/$name.md"
          echo "produced=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.post.outputs.produced == 'true'
        with:
          # The markdown for reading, the per-arm JSON for anything that wants to compute on it.
          name: compile-cost-report
          path: |
            results/*.md
            results/report-*.json
