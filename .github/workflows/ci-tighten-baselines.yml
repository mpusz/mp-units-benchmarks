# Automatic baseline tightening.
#
# When mp-units needs measurably fewer instantiations than the recorded baselines, leaving those
# baselines stale silently desensitizes the gate: a later regression of the same size would pass
# unnoticed. This job notices instead of a human having to read a warning annotation, and opens a
# PR with the re-recorded baselines so the tightening is a reviewable diff.
#
# Regressions are deliberately NOT auto-PRed - a red gate is a decision, not a chore.
name: Tighten baselines

on:
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC - an improvement should not wait a week to be recorded
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Keep in step with ci-self-test.yml: the baselines and the self-test must describe the same
  # library ref, otherwise a tightening PR would fail its own self-test.
  MP_UNITS_REF: master
  CLANG_VERSION: 21
  BRANCH: auto/tighten-baselines
  # Percent a single workflow (or the non-umbrella median) must improve before a PR is opened.
  # MIN_IMPROVEMENT matches the band `check` warns at, so every "baselines can be tightened"
  # warning turns into a PR rather than an annotation someone has to notice. The metric is
  # deterministic, so these are real wins, not noise - there is no reason to let them accumulate.
  MIN_IMPROVEMENT: 2
  MIN_MEDIAN_IMPROVEMENT: 1

jobs:
  tighten:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check out mp-units at ${{ env.MP_UNITS_REF }}
        uses: actions/checkout@v5
        with:
          repository: mpusz/mp-units
          ref: ${{ env.MP_UNITS_REF }}
          path: mp-units
      - name: Install Clang ${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_VERSION }}
      - name: Install Libc++
        shell: bash
        run: |
          sudo apt install -y libc++-${{ env.CLANG_VERSION }}-dev libc++abi-${{ env.CLANG_VERSION }}-dev libunwind-${{ env.CLANG_VERSION }}-dev
      - name: Measure against the recorded baselines
        # A regression exits 1; the report is still written, and the next step decides on it.
        run: runner/bench.py --repo mp-units --cxx clang++-${{ env.CLANG_VERSION }} check --report results/report.json || true
      - name: Decide whether the baselines can be tightened
        id: decide
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          report = pathlib.Path("results/report.json")
          min_single = float(os.environ["MIN_IMPROVEMENT"]) / 100
          min_median = float(os.environ["MIN_MEDIAN_IMPROVEMENT"]) / 100

          def decide(value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"tighten={value}\n")

          if not report.exists():
              print("no report written - check never got as far as comparing counts")
              decide("false")
              sys.exit(0)

          r = json.loads(report.read_text())
          if r["regressions"]:
              print("regressions present, leaving this to a human:", ", ".join(r["regressions"]))
              decide("false")
              sys.exit(0)

          workflows = r["workflows"]
          best = min((d["rel"] for d in workflows.values() if not d["umbrella"]), default=0.0)
          median = r["median_non_umbrella"]
          if best > -min_single and median > -min_median:
              print(f"nothing worth a PR (best {best:+.1%}, median {median:+.1%})")
              decide("false")
              sys.exit(0)

          lines = [
              f"mp-units {r['mp_units_version']} needs measurably fewer template instantiations than",
              f"`baselines/instantiations-{r['baseline_key']}.json` records, so the baselines are stale.",
              "Leaving them stale desensitizes the gate: a later regression of the same size would pass",
              "unnoticed.",
              "",
              f"- best single workflow: **{best:+.1%}** (PR threshold {-min_single:+.0%})",
              f"- median across non-umbrella workflows: **{median:+.1%}** (PR threshold {-min_median:+.0%})",
              f"- measured with `{r['cxx']}` against `{os.environ['MP_UNITS_REF']}`",
              "",
              "| workflow | baseline | current | delta |",
              "|---|---:|---:|---:|",
          ]
          for name, d in sorted(workflows.items(), key=lambda kv: kv[1]["rel"]):
              label = f"{name} (churn-expected)" if d["umbrella"] else name
              lines.append(f"| {label} | {d['baseline']} | {d['current']} | {d['rel']:+.1%} |")
          lines += ["", "Generated by the `Tighten baselines` workflow. Review the numbers before merging:",
                    "a re-record blesses the current counts of *every* workflow, not only the improved ones."]
          pathlib.Path("pr-body.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          decide("true")
          PY
      - name: Re-record the baselines
        if: steps.decide.outputs.tighten == 'true'
        run: runner/bench.py --repo mp-units --cxx clang++-${{ env.CLANG_VERSION }} update --baseline-key clang${{ env.CLANG_VERSION }}
      - name: Open or refresh the pull request
        if: steps.decide.outputs.tighten == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add baselines
          git commit -m "chore: tighten instantiation baselines

          Re-recorded against mp-units ${MP_UNITS_REF} (see the PR body for per-workflow deltas)."
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --body-file pr-body.md
            echo "refreshed the open PR"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore: tighten instantiation baselines" --body-file pr-body.md
          fi
